# The video half of the REDESIGN.md §15.5 pipeline, on a runner.
#
# Same reason as fetch-media-v3.yml: the session that generates the clips
# cannot reach Higgsfield's CDN — its egress answers 403 on CONNECT — so it can
# neither download a candidate nor look at one to cull. Runners have open
# internet, and ffmpeg preinstalled, which the stills pipeline did not need.
#
# Two modes, run in order:
#
#   candidates  downloads every candidate in the manifest's `videos` and commits
#               one flat contact sheet per video to docs/media-v3-review/ —
#               frames sampled across the clip, including both ends, so a loop
#               can actually be judged. Cull from that, then set
#               "keeper": "a" | "b" on the video in docs/media-v3-manifest.json.
#
#   masters     downloads the keeper and writes public/media/v3/<id>.mp4,
#               <id>.webm and <id>-poster.avif, plus the poster's LQIP into
#               src/lib/media-v3-blur.json. §15.3's 2.5 MB ceiling is enforced
#               in the script, which fails rather than committing an oversized
#               loop.
#
# ffmpeg is NOT present on ubuntu-latest — it was dropped from the ubuntu-24.04
# image — so this installs it explicitly. The first run of this workflow failed
# on exactly that, and failed twice over: the verification step piped
# `ffmpeg -version` into `head`, so the pipeline exited 0 on `command not found`
# and reported success while the tool was missing.
#
# Safe to delete once the video masters are committed.
name: Fetch Part 15 video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "candidates = contact sheet to cull from · masters = MP4 + WebM + poster"
        type: choice
        options: [candidates, masters]
        default: candidates
      force:
        description: "Re-download and re-encode even where the output already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-media-v3-video
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts skips the prisma-generate postinstall (needless here);
      # sharp still gets its prebuilt binary via optional dependencies.
      - run: npm ci --ignore-scripts

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      # `command -v`, not `ffmpeg -version | head -1`: a pipeline takes its exit
      # status from the LAST command, so `head` returning 0 masked a missing
      # binary and let the job walk into a raw ENOENT three steps later.
      - name: Verify ffmpeg
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Run the §15.3 video pipeline
        run: |
          node scripts/media-v3-video-fetch.mjs \
            ${{ inputs.mode == 'candidates' && '--candidates' || '' }} \
            ${{ inputs.force && '--force' || '' }}

      # The downloaded sources stay out of git (.media-v3-video-tmp is ignored);
      # keep them for one run so a keeper can be watched at full size without
      # re-downloading.
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'candidates'
        with:
          name: media-v3-video-candidates
          path: .media-v3-video-tmp/
          retention-days: 7
          # The directory is dot-prefixed, which the action treats as hidden
          # and silently skips ("No files were found with the provided path").
          include-hidden-files: true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # One path at a time: `git add a b c` fails outright — staging
          # nothing — as soon as one pathspec matches no file, and which of
          # these exist depends on the mode. `if` rather than `&&` because the
          # step runs under `bash -e`.
          for p in docs/media-v3-review public/media/v3 src/lib/media-v3-blur.json; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing to commit — already up to date."
          else
            git commit -m "chore(media): Part 15 video — ${{ inputs.mode }}"
            git push origin HEAD:${{ github.ref_name }}
          fi
