# Phase 4 step 1 — archive the Google Sheets sync history, then commit it.
#
# WHY THIS IS A WORKFLOW rather than something an agent runs: the production
# DATABASE_URL exists only in Vercel's environment. It is not in the repo, not
# in CI (which uses a throwaway Postgres), and not in any agent sandbox. This
# runs where a credential can legitimately be held — a repo secret — and
# commits the result, which is the same shape the deleted fetch-tiers workflow
# used for the tier CSVs.
#
# READ-ONLY against the database. `export:sheets-history` selects SheetSyncRun
# and ImportConflict, writes CSVs, and touches nothing. Safe to run twice; a
# second run writes a second dated directory.
#
# SheetSyncRun is the ONLY copy of the push history and phase 4 step 4's drop
# migration destroys it, so this has to succeed before that PR can be written.
name: Export Sheets history (one-off, before the drop)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fail early with a useful message if the secret is missing
        run: |
          if [ -z "${{ secrets.PRODUCTION_DATABASE_URL }}" ]; then
            echo "::error::PRODUCTION_DATABASE_URL is not set. Add it under Settings → Secrets and variables → Actions. Copy the value from Vercel → the project → Settings → Environment Variables → DATABASE_URL (Production)."
            exit 1
          fi

      - name: Export
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npm run export:sheets-history

      - name: Commit the archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/archive
          if git diff --cached --quiet; then
            echo "::warning::Nothing to commit — the export wrote no new files. If SheetSyncRun was already empty that is the expected result and the drop is safe."
          else
            git commit -m "chore(archive): Google Sheets sync history, exported before the drop"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
