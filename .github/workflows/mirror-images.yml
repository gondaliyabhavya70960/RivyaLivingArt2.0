# Mirrors the Step-4 generated covers (public Higgsfield CDN) into
# public/images/{categories,blog}/<slug>.webp and commits them back to this
# branch. Exists because the build sandboxes' egress policy blocks the CDN
# host — Actions runners have open internet (backlog #2; see
# scripts/mirror-generated-images.mjs). Safe to delete once the images are
# committed and production has flipped to the local paths.
name: Mirror generated images

# NOTE: this workflow's `push` trigger was pinned to a feature branch that no longer
# exists, so it has never fired. Removed rather than re-pointed at `main`: these jobs
# mirror remote assets and push commits back, and enabling that is an owner decision,
# not a side effect of fixing a stale ref. Run it with workflow_dispatch.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-images
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts skips the prisma-generate postinstall (needless here);
      # sharp still gets its prebuilt binary via its own install-time optional
      # dependencies, which npm resolves from the lockfile, not postinstall.
      - run: npm ci --ignore-scripts

      - run: node scripts/mirror-generated-images.mjs

      - name: Verify 60 files
        run: |
          c=$(ls public/images/categories/*.webp | wc -l)
          b=$(ls public/images/blog/*.webp | wc -l)
          echo "categories: $c, blog: $b"
          test "$c" -eq 5 && test "$b" -eq 55

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images
          if git diff --cached --quiet; then
            echo "Nothing to commit — images already mirrored."
          else
            git commit \
              -m "Mirror the 60 generated covers first-party (backlog #2, via Actions)" \
              -m "public/images/{categories,blog}/<slug>.webp downloaded from the public Higgsfield CDN by scripts/mirror-generated-images.mjs (sharp -> WebP, 1200w/1600w). prisma/generated-cover.ts prefers these local paths, so the category seed and the reconcile-blog-covers step flip the DB rows off the third-party CDN on the next deploy."
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
