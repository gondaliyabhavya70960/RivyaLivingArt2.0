# Runs the REDESIGN.md §15.5 pipeline on an Actions runner.
#
# The session that generated the Part 15 set (docs/media-v3-manifest.json)
# could not finish it: its egress policy answers 403 to Higgsfield's CDN, so it
# could neither download the candidates nor render them to cull. Actions
# runners have open internet — the same reason mirror-v3-media.yml exists.
#
# Two modes, run in order:
#
#   candidates  downloads all 46 candidates and commits four review sheets to
#               docs/media-v3-review/ — flat JPEGs anyone (or any agent) can
#               open without the CDN. Cull from those, then set
#               "keeper": "a" | "b" on each asset in the manifest.
#
#   masters     downloads each keeper, writes one AVIF master per asset into
#               public/media/v3/ and the 20px LQIP manifest into
#               src/lib/media-v3-blur.json.
#
# Safe to delete once public/media/v3 is committed.
name: Fetch Part 15 media

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "candidates = review sheets to cull from · masters = final AVIFs + LQIP"
        type: choice
        options: [candidates, masters]
        default: candidates
      force:
        description: "Re-download and re-encode even where the output already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-media-v3
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts skips the prisma-generate postinstall (needless here);
      # sharp still gets its prebuilt binary via optional dependencies.
      - run: npm ci --ignore-scripts

      - name: Run the §15.5 pipeline
        run: |
          node scripts/media-v3-fetch.mjs \
            ${{ inputs.mode == 'candidates' && '--candidates' || '' }} \
            ${{ inputs.force && '--force' || '' }}

      # The candidate AVIFs stay out of git (.media-v3-candidates is ignored);
      # keep them for one run as an artifact so a keeper can be inspected at
      # full size without re-downloading all forty-six.
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'candidates'
        with:
          name: media-v3-candidates
          path: .media-v3-candidates/
          retention-days: 7
          # The directory is dot-prefixed, which the action treats as hidden
          # and silently skips ("No files were found with the provided path").
          include-hidden-files: true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # One path at a time: `git add a b c` fails outright — staging
          # nothing — as soon as one pathspec matches no file, and which of
          # these exist depends on the mode. `if` rather than `&&` because the
          # step runs under `bash -e`.
          for p in docs/media-v3-review public/media/v3 src/lib/media-v3-blur.json; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing to commit — already up to date."
          else
            git commit -m "Fetch Part 15 media (${{ inputs.mode }}, via Actions)" \
              -m "REDESIGN.md §15.5 run by .github/workflows/fetch-media-v3.yml from docs/media-v3-manifest.json. Actions runners can reach the Higgsfield CDN that the generating session's egress policy blocks."
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
