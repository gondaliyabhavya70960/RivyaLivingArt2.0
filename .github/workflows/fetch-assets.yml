name: Fetch generated assets

# E4.1 asset pipeline helper (the mirror-*-media pattern, generalized):
# downloads generated media (Higgsfield exports) into the repo because the
# dev sandbox's egress policy blocks media CDN hosts while Actions runners
# have open internet. Two entry points: the push trigger fires on this
# branch whenever this file or the manifest changes; workflow_dispatch
# accepts an inline JSON manifest once the workflow is registered.

# NOTE: this workflow's `push` trigger was pinned to a feature branch that no longer
# exists, so it has never fired. Removed rather than re-pointed at `main`: these jobs
# mirror remote assets and push commits back, and enabling that is an owner decision,
# not a side effect of fixing a stale ref. Run it with workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: 'JSON array: [{"url":"https://...","path":"public/..."}]'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fetch-assets-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download assets
        env:
          MANIFEST_INPUT: ${{ inputs.manifest }}
        run: |
          if [ -n "$MANIFEST_INPUT" ]; then
            printf '%s' "$MANIFEST_INPUT" > /tmp/manifest.json
          else
            cp scripts/fetch-assets-manifest.json /tmp/manifest.json
          fi
          jq -c '.[]' /tmp/manifest.json | while read -r item; do
            url=$(printf '%s' "$item" | jq -r .url)
            path=$(printf '%s' "$item" | jq -r .path)
            # Only https sources; only repo-relative destinations.
            case "$url" in https://*) ;; *) echo "skip non-https: $url"; continue;; esac
            case "$path" in /*|*..*) echo "skip unsafe path: $path"; continue;; esac
            mkdir -p "$(dirname "$path")"
            curl -sfL --retry 3 -o "$path" "$url"
            echo "fetched $path"
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit — assets already mirrored."
          else
            git commit -m "chore(assets): fetch generated assets via Actions"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
